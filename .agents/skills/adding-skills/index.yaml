name: adding-skills
version: "0.1.0"
description: "Add a new skill to a construct — two-phase scaffolding (create shell, then grow capabilities)"

triggers:
  - pattern: "/skill-add"
    description: "Add a new skill to the current construct"

entry: .claude/skills/adding-skills/SKILL.md

capabilities:
  model_tier: sonnet
  danger_level: safe
  effort_hint: small
  downgrade_allowed: true
  execution_hint: sequential
  requires:
    native_runtime: false
    tool_calling: true
    thinking_traces: false
    vision: false
