# construct-network-tools · the exemplar pack
# ================================================================
# Authored cycle-006 L-meta-pack · 2026-04-23.
#
# This pack is an EXEMPLAR, not a toolbox. It demonstrates the v3
# authoring conventions (streams, persona handles, grimoire paths,
# butterfreezone-generated CONSTRUCT-README.md). A new construct
# author reads THIS pack to understand what "good" looks like.
#
# Taste statement: the operator who composes hivemind + artisan +
# k-hole + the-arcade knows the ecosystem through four lenses —
# knowledge, craft, depth, structure. This pack is what that
# composition *looks like* as a pack you can install.
#
# Doctrine: v6 · [[constructs-as-packages]] §"Meta-pack as EXEMPLAR"
# Closes: F33 from cycle-005 findings
# ================================================================

schema_version: 3

name: "Construct Network Tools"
slug: construct-network-tools
version: 0.1.0

description: "Exemplar pack — demonstrates v3 authoring conventions (streams, persona handles, grimoire paths, CONSTRUCT-README.md autogen). The first pack a new author reads."
short_description: "Exemplar for construct authors"

author: 0xHoneyJar
license: MIT
type: skill-pack
visibility: public

domain:
  - development
  - documentation

# Operator-facing skills — kept intentionally small. The point isn't
# comprehensive coverage; the point is demonstrating the shape.
skills:
  - slug: exploring-network
    path: skills/exploring-network

# Slash commands registered in the Loa runtime. Operators invoke
# /explore-network to discover constructs + their relationships.
commands:
  - name: explore-network
    path: commands/explore-network.md

# Composition — taste stack. The operator who installs this pack
# gets the four-lens view on the network: knowledge, craft, depth,
# structure.
compose_with:
  - slug: hivemind
    relationship: "Knowledge lens — what do you already know, and where does it live?"
  - slug: artisan
    relationship: "Craft lens — does this meet the standard?"
  - slug: k-hole
    relationship: "Depth lens — what are you missing? What's not yet mapped?"
  - slug: the-arcade
    relationship: "Structure lens — how do the pieces compose into a shipped thing?"

# Grimoire paths. The interface IS the path (doctrine v5 §17.4).
composition_paths:
  writes:
    - grimoires/network-tools/
  reads:
    - grimoires/hivemind/
    - grimoires/artisan/taste.md

# Typed streams this construct consumes and produces (doctrine §3).
# This pack guides exploration; it reads operator Intent + emits
# Verdict ("here's what matters for your query") + Signal ("here
# are related threads to pull").
streams:
  reads:
    - Intent          # operator utterance seeking ecosystem wayfinding
    - Operator-Model  # what the operator knows — tunes recommendation depth
  writes:
    - Verdict         # curated recommendations with rationale
    - Signal          # related threads surfaced during exploration

repository:
  url: https://github.com/0xHoneyJar/construct-network-tools.git
  homepage: https://constructs.network/constructs/construct-network-tools

events:
  emits:
    - type: forge.network-tools.construct_recommended
      description: Emitted when CURATOR recommends a construct for an operator's need
      data_schema:
        target_construct_slug: string
        reasoning: string
        alternatives: array
    - type: forge.network-tools.ecosystem_explored
      description: Emitted when an operator completes an ecosystem exploration session
      data_schema:
        constructs_surveyed: number
        threads_surfaced: array
  consumes:
    - event: forge.hivemind.concept_looked_up
      description: "Hivemind lookups feed CURATOR's ecosystem-context awareness"

# Persona handle convention (cycle-005 L3 template v3).
# CURATOR is the persona — curates the network, guides operators
# through the ecosystem with a taste-carrying selection lens.
identity:
  persona: identity/persona.yaml
  handles:
    - CURATOR

# Pack dependencies — the taste stack is load-bearing. A fresh
# operator installing this pack also needs these four constructs
# available for the composition to fire.
pack_dependencies:
  - slug: hivemind
    version: ">=0.1.0"
    source: "git+https://github.com/0xHoneyJar/hivemind.git"  # cycle-007: registry-published
    note: "URL-installed until cycle-007 pack scaffolding lands"
  - slug: artisan
    version: ">=1.0.0"
  - slug: k-hole
    version: ">=1.0.0"
  - slug: the-arcade
    version: ">=1.0.0"

# Butterfreezone marker — CONSTRUCT-README.md is autogenerated.
# Hand-authored README.md covers the narrative; CONSTRUCT-README
# is the mechanical inventory.
docs:
  construct_readme_generator: butterfreezone
  readme_source: hand-authored (README.md)
