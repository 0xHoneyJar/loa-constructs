# Rejection case: composition declares iterate[[1, 2]] WITH max_iterations
# but WITHOUT terminate_when. Validator must emit [ITERATION-NO-TERMINATION]
# and MUST NOT emit [ITERATION-NO-MAX] (since max is present).
# Sprint 1 (S1-T6) — paired-fixture closure for the iteration mandate per
# SDD §4.1 / FR-7.2 (max_iterations + termination required).
schema_version: "1.2"
kind: workflow
name: validator-iterate-no-termination
description: iterate[] non-empty WITH max_iterations but no terminate_when.
intent: Validate that the runtime refuses iteration without an explicit termination predicate, even when max_iterations bounds the loop.

iterate:
  - [1, 2]
max_iterations: 5
# DELIBERATELY MISSING: terminate_when

chain:
  - stage: 1
    construct: artisan
    skill: decomposing-feel
    reads: []
    writes:
      - type: Signal
  - stage: 2
    construct: observer
    skill: observing-users
    reads:
      - type: Signal
    writes: []
