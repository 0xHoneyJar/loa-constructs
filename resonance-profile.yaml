# Resonance Profile — loa-constructs / constructs.network
#
# This is the project's k-hole fingerprint.
# What pulls us toward depth. What we keep returning to.
# Not what we build — what we're drawn to while building.

keywords:
  - bazaar over mall
  - reputation as portable trust
  - depth as its own reward
  - progressive disclosure through state not time
  - constraint as creative catalyst
  - the underground forums were the birth of greatness

references:
  - Neuromancer (Gibson) — Freeside as constructed habitat with shared physics
  - Marrakech souk — trust through density, friction, and social ritual
  - Jane Jacobs — eyes on the street, self-policing through presence
  - Sythe/SilkRoad — vouch systems, PGP-portable reputation, middlemen as trust infrastructure
  - Dark Souls — bloodstains as collective consequence, loneliness as design
  - Raph Koster — fun is just another word for learning
  - Wabi-sabi — impermanence, imperfection, incompleteness as aesthetic foundation

touchstones:
  - agents and humans walk the same streets, face the same friction, earn the same reputation
  - the loudest person in the bazaar knows the least
  - fun first, then learning, then earning
  - behavior over belief — watch what they do, not what they say
  - names create gravity — load-bearing metaphors, not decoration
  - the resonance profile is a self-portrait

aesthetic: >
  Systems-driven, melancholic, anti-extractive. Interested in how
  designed constraints create emergent trust. The bazaar over the
  mall. Depth over breadth. The person who stays over the person
  who arrives loudly. Gibson's Sprawl as operating metaphor —
  not decoration but architecture. Everything should feel like
  it was always there, waiting to be found.
