name: Sync Constructs

# Keeps production DB in sync with construct-* repos.
# Runs daily after discovery, on manual trigger, and on repository_dispatch
# from construct repos (if configured).

permissions:
  contents: read

on:
  schedule:
    # Daily at 06:30 UTC (30 min after discover-constructs)
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      auto_discover:
        description: 'Scan org for new repos (requires PAT with org:read)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      only:
        description: 'Sync only specific constructs (comma-separated slugs). Leave empty for all.'
        required: false
        default: ''
        type: string
  repository_dispatch:
    types: [construct-updated]

jobs:
  sync:
    name: Seed Production DB
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build shared package
        run: bun run --filter @loa-constructs/shared build

      - name: Run seed script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONSTRUCTS_ORG: '0xHoneyJar'
        run: |
          FLAGS=""
          # Auto-discover requires a PAT with org:read scope (not available with GITHUB_TOKEN)
          AUTO_DISCOVER="${{ github.event.inputs.auto_discover || 'false' }}"
          if [ "$AUTO_DISCOVER" = "true" ]; then
            FLAGS="$FLAGS --auto-discover"
          fi
          # --only scoping: when set, ONLY sync the specified constructs
          ONLY="${{ github.event.inputs.only || '' }}"
          if [ -n "$ONLY" ]; then
            FLAGS="$FLAGS --only $ONLY"
          fi
          # repository_dispatch from a specific construct: scope to that slug
          DISPATCH_SLUG="${{ github.event.client_payload.slug || '' }}"
          if [ -n "$DISPATCH_SLUG" ] && [ -z "$ONLY" ]; then
            FLAGS="$FLAGS --only $DISPATCH_SLUG"
          fi
          echo "Running: bun scripts/seed-forge-packs.ts $FLAGS"
          bun scripts/seed-forge-packs.ts $FLAGS

      - name: Summary
        if: always()
        run: |
          echo "## Construct Sync Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Auto-discover**: ${{ github.event.inputs.auto_discover || 'false' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Only**: ${{ github.event.inputs.only || 'all' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
