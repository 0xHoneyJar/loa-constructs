name: Sync Registry

# Cycle-012 rewrite: posts to the live API's /v1/admin/discover endpoint
# to keep the Turso-backed registry synchronized with the GitHub org.
# Replaces the legacy GIT_CONFIGS / seed-forge flow (Postgres era).

permissions:
  contents: read

on:
  schedule:
    # Every 6 hours. API is cheap, GitHub API cost is bounded by org size.
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      org:
        description: 'GitHub org to scan'
        required: false
        default: '0xHoneyJar'
      dry_run:
        description: 'Dry-run (no DB writes)'
        required: false
        default: 'false'

jobs:
  sync:
    name: POST /v1/admin/discover
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Invoke discovery
        env:
          ORG: ${{ github.event.inputs.org || '0xHoneyJar' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          ADMIN_TOKEN: ${{ secrets.CONSTRUCTS_ADMIN_TOKEN }}
          API_BASE: https://api.constructs.network
        run: |
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "::error::CONSTRUCTS_ADMIN_TOKEN repo secret not set — see apps/api/docs/admin-token-rotation.md"
            exit 1
          fi

          RESPONSE=$(curl -sS -X POST \
            "${API_BASE}/v1/admin/discover?owner=${ORG}&dry_run=${DRY_RUN}" \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            -H "User-Agent: loa-constructs-sync/cycle-012")

          echo "$RESPONSE" > /tmp/sync.json

          echo "## Sync Registry Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Run ID | $(jq -r '.run_id' /tmp/sync.json) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Org | $ORG |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dry run | $DRY_RUN |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Found | $(jq -r '.constructs_found' /tmp/sync.json) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Created | $(jq -r '.constructs_created' /tmp/sync.json) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Updated | $(jq -r '.constructs_updated' /tmp/sync.json) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Duration ms | $(jq -r '.duration_ms' /tmp/sync.json) |" >> "$GITHUB_STEP_SUMMARY"

          ERR_COUNT=$(jq -r '.errors | length' /tmp/sync.json)
          if [ "$ERR_COUNT" -gt 0 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Errors ($ERR_COUNT)" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.errors[] | "- \(.)"' /tmp/sync.json >> "$GITHUB_STEP_SUMMARY"
          fi

          # Fail the run if the API surfaced an error envelope
          if jq -e '.error' /tmp/sync.json > /dev/null; then
            echo "::error::Sync failed: $(jq -r '.error.message' /tmp/sync.json)"
            exit 1
          fi
