name: Discover Constructs

# Runs daily and on manual trigger to find new construct-* repos in the org
# Reports gaps between GitHub org namespace and registry

permissions:
  contents: read

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      org:
        description: 'GitHub org to scan'
        required: false
        default: '0xHoneyJar'

jobs:
  discover:
    name: Scan Namespace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run discovery scan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONSTRUCTS_ORG: ${{ github.event.inputs.org || '0xHoneyJar' }}
        run: bun tsx scripts/discover-constructs.ts --register --json > /tmp/discovery.json

      - name: Report results
        run: |
          echo "## Construct Discovery Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          TOTAL=$(jq '.summary.total' /tmp/discovery.json)
          REGISTERED=$(jq '.summary.registered' /tmp/discovery.json)
          MISSING=$(jq '.summary.missing' /tmp/discovery.json)
          BARE=$(jq '.summary.bare' /tmp/discovery.json)

          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Total construct-* repos | $TOTAL |" >> $GITHUB_STEP_SUMMARY
          echo "| Registered | $REGISTERED |" >> $GITHUB_STEP_SUMMARY
          echo "| Missing (has manifest) | $MISSING |" >> $GITHUB_STEP_SUMMARY
          echo "| Bare (no manifest) | $BARE |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$MISSING" -gt 0 ]; then
            echo "### Missing from Registry" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            jq -r '.register.missing[] | "- **\(.slug)** — \(.description // "no description") [\(.gitUrl)]"' /tmp/discovery.json >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> Run \`AUTO_DISCOVER=true bun seed:forge\` to register these constructs." >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$BARE" -gt 0 ]; then
            echo "### Bare Repos (no manifest)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            jq -r '.results[] | select(.hasManifest == false) | "- **\(.slug)** — needs construct.yaml"' /tmp/discovery.json >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$MISSING" -gt 0 ]; then
            echo ""
            echo "WARNING: $MISSING construct(s) with manifest not registered."
            echo "Run: AUTO_DISCOVER=true bun seed:forge"
          fi
