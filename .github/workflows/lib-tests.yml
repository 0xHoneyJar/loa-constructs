name: Lib Tests

# Least-privilege permissions
permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - '.claude/lib/**'
      - '.claude/scripts/run-lib-tests.sh'
      - '.github/workflows/lib-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - '.claude/lib/**'
      - '.claude/scripts/run-lib-tests.sh'
      - '.github/workflows/lib-tests.yml'

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['18', '20', '22']

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Bun for workspace-safe tool installation
        uses: oven-sh/setup-bun@v2

      - name: Install tsx outside the workspace
        run: |
          mkdir -p "$RUNNER_TEMP/tsx"
          cd "$RUNNER_TEMP/tsx"
          bun init -y
          bun add --exact tsx@4.21.0
          echo "$RUNNER_TEMP/tsx/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Run lib tests
        env:
          LOA_LIB_TEST_SKIP_BUN: '1'
        run: .claude/scripts/run-lib-tests.sh

      - name: Run barrel smoke test
        env:
          LOA_LIB_TEST_SKIP_BUN: '1'
        run: .claude/scripts/run-lib-tests.sh --smoke
